# Which provider and model does each job, plus per-job settings.
# Format: model = "<provider>:<model id>". Override any line with an env var,
# e.g. MODEL_PERCEIVE=gemini:gemini-4-argon. Changing a line needs no code change.
#
# Model IDs below were confirmed by listing models with the event API key
# (Nov 21 2026): gemini-4-hydrogen, gemini-4-argon, gemini-4-neon, gemini-4-carbon.

[defaults]
timeout_s = 90
retries = 1

[jobs.hello]
model = "gemini:gemini-4-hydrogen"
thinking = "low"

[jobs.perceive]
model = "gemini:gemini-4-hydrogen"    # fast tier; one call per file
media_resolution = "high"
video_fps = 2
thinking = "low"

[jobs.perceive_fallback]
model = "gemini:gemini-4-argon"       # if Hydrogen's output is weak
media_resolution = "high"
video_fps = 2
thinking = "low"

[jobs.decide]
model = "gemini:gemini-decision-1"    # Decisions API (client.decisions.create); listed only under v1alpha
api_version = "v1alpha"
media_resolution = "high"

[jobs.transcribe]
# Only used when the perceive model can't hear (no audio_in). No dedicated transcription model is
# listed for this key, so Hydrogen, which takes audio, does it.
model = "gemini:gemini-4-hydrogen"
thinking = "low"

[jobs.decide_fallback]
model = "gemini:gemini-4-hydrogen"    # generic enum generate_json, used when the Decisions API call fails
thinking = "low"

# Track B jobs: planning, commerce, route, final judge steps, baseline, and arrival render.

[jobs.plan]
# Track B planner loop (backend/planner.py): reads the checker's score and violations, returns changed
# solver settings. Text in, small JSON out. Neon is the planning model in plan/EVENT_DAY_PLAN.md.
model = "gemini:gemini-4-neon"
thinking = "low"
timeout_s = 60

[jobs.shop]
model = "gemini:gemini-4-neon"        # Shopify shop.dev Shopping Agent (tier/bundle planning & Q&A)
thinking = "low"

[jobs.route]
model = "gemini:gemini-4-neon"        # Live Point A->B truck route, toll, clearance & city parking advisor
thinking = "low"
timeout_s = 25

[jobs.judge]
model = "gemini:gemini-decision-1"    # single-pass calibrated noul/choice/score rubrics (0 output tokens)
api_version = "v1alpha"
media_resolution = "high"

[jobs.judge_escalate]
model = "gemini:gemini-4-neon"        # escalates low-confidence or flagged judge checks (override with Carbon if needed)
thinking = "high"
media_resolution = "high"

[jobs.baseline]
model = "gemini:gemini-4-hydrogen"    # single-call baseline for eval comparison
thinking = "low"

[jobs.image]
model = "gemini:gemini-nano-banana-2.1"  # illustrative Penn Station arrival render (multi-image ref fusion)
timeout_s = 90

[jobs.video]
model = "gemini:gemini-omni-1.2-flash"   # Penn Station first->last frame arrival hyper-lapse MP4 (v1beta only)
api_version = "v1beta"
timeout_s = 300
retries = 0

[jobs.tts]
model = "gemini:gemini-3.8-flash-tts"    # Vinny NYC Foreman + ARIA Verifier 15s multi-speaker crew radio (v1beta only)
api_version = "v1beta"
timeout_s = 45

[jobs.robotics]
model = "gemini:gemini-robotics-er-2-preview"  # Embodied spatial reasoning: [y,x] path-clear, robot picks, human grips & Penn keep-out zones
api_version = "v1beta"
thinking = "low"
timeout_s = 35

[jobs.robotics_fallback]
model = "gemini:gemini-4-neon"                 # Drop-in spatial JSON fallback if robotics preview is rate-limited
thinking = "low"
timeout_s = 30

# Submission video build (scripts/video/build.py, plan/VIDEO_SCRIPT.md). Not used by the app.

[jobs.narrate]
model = "gemini:gemini-3.8-flash-tts"     # one narration clip per shot; tested 15:10 (24 words, 9.84 s)
api_version = "v1beta"
voice = "Charon"
style = "warm, calm and clear, like a friend explaining a project; unhurried"
retries = 1

[jobs.video_open]
model = "gemini:gemini-omni-1.2-flash"    # 4 s generated opening, labelled "generated video" on screen
api_version = "v1beta"
duration_s = 4
resolution = "1080p"
aspect_ratio = "16:9"
timeout_s = 600
retries = 0

[jobs.slides]
model = "gemini:gemini-4-carbon"          # judging slide deck, HTML (scripts/slides/build.py); demo outputs are made by Gemini (AGENTS.md)
thinking = "medium"                     # high took 5-9 min per call (FAILURES.md 16:12); medium on Chris's choice
media_resolution = "medium"
timeout_s = 600
retries = 1

[jobs.video_script]
model = "gemini:gemini-4-carbon"          # the video's narration lines and title/results/end cards (scripts/video/build.py --write-script)
thinking = "high"
timeout_s = 600
retries = 1
