# Which provider and model does each job, plus per-job settings.
# Format: model = "<provider>:<model id>". Override any line with an env var,
# e.g. MODEL_PERCEIVE=gemini:gemini-4-argon. Changing a line needs no code change.
#
# Model IDs below were confirmed by listing models with the event API key
# (Nov 21 2026): gemini-4-hydrogen, gemini-4-argon, gemini-4-neon, gemini-4-carbon.

[defaults]
timeout_s = 90
retries = 1

[jobs.hello]
model = "gemini:gemini-4-hydrogen"
thinking = "low"

[jobs.perceive]
model = "gemini:gemini-4-hydrogen"    # fast tier; one call per file
media_resolution = "high"
video_fps = 2
thinking = "low"

[jobs.perceive_fallback]
model = "gemini:gemini-4-argon"       # if Hydrogen's output is weak
media_resolution = "high"
video_fps = 2
thinking = "low"

[jobs.decide]
model = "gemini:gemini-decision-1"    # Decisions API (client.decisions.create); listed only under v1alpha
api_version = "v1alpha"
media_resolution = "high"

[jobs.transcribe]
# Only used when the perceive model can't hear (no audio_in). No dedicated transcription model is
# listed for this key, so Hydrogen, which takes audio, does it.
model = "gemini:gemini-4-hydrogen"
thinking = "low"

[jobs.decide_fallback]
model = "gemini:gemini-4-hydrogen"    # generic enum generate_json, used when the Decisions API call fails
thinking = "low"

# Track B jobs: planning, commerce, route, final judge steps, baseline, and arrival render.

[jobs.plan]
# Track B planner loop (backend/planner.py): reads the checker's score and violations, returns changed
# solver settings. Text in, small JSON out. Neon is the planning model in plan/EVENT_DAY_PLAN.md.
model = "gemini:gemini-4-neon"
thinking = "low"
timeout_s = 60

[jobs.shop]
model = "gemini:gemini-4-neon"        # Shopify shop.dev Shopping Agent (tier/bundle planning & Q&A)
thinking = "low"

[jobs.route]
model = "gemini:gemini-4-neon"        # Live Point A->B truck route, toll, clearance & city parking advisor
thinking = "low"
timeout_s = 25

[jobs.judge]
model = "gemini:gemini-decision-1"    # single-pass calibrated noul/choice/score rubrics (0 output tokens)
api_version = "v1alpha"
media_resolution = "high"

[jobs.judge_escalate]
model = "gemini:gemini-4-neon"        # escalates low-confidence or flagged judge checks (override with Carbon if needed)
thinking = "high"
media_resolution = "high"

[jobs.baseline]
model = "gemini:gemini-4-hydrogen"    # single-call baseline for eval comparison
thinking = "low"

[jobs.image]
model = "gemini:gemini-nano-banana-2.1"  # illustrative Penn Station arrival render
