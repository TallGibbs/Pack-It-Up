<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pack It Up · Printable Offline QR Box Labels</title>
  <style>
    :root {
      --bg: #0f141a;
      --panel: #18202a;
      --border: #2a3644;
      --text: #f3f6fa;
      --muted: #9badc0;
      --accent: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .toolbar {
      max-width: 1060px;
      margin: 0 auto 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .toolbar h1 {
      margin: 0;
      font-size: 1.15rem;
    }
    .sub {
      color: var(--muted);
      font-size: 0.86rem;
      margin-top: 3px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button, select, .btn-link, .upload-btn {
      appearance: none;
      background: #222d3a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button.primary {
      background: var(--accent);
      color: #062218;
      border-color: var(--accent);
    }
    #scanResult {
      max-width: 1060px;
      margin: 0 auto 16px;
      background: #142822;
      border: 1px solid #2b6cb0;
      border-color: rgba(52, 211, 153, 0.45);
      border-radius: 10px;
      padding: 12px 15px;
      display: none;
      font-size: 0.92rem;
    }
    .grid {
      max-width: 1060px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }
    .label-card {
      background: #ffffff;
      color: #111827;
      border-radius: 10px;
      border: 2px solid #1f2937;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .band {
      padding: 8px 12px;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-weight: 800;
    }
    .short-name {
      font-size: 1.28rem;
      letter-spacing: 0.02em;
    }
    .stop-tag {
      font-size: 0.8rem;
      background: rgba(0, 0, 0, 0.28);
      padding: 2px 7px;
      border-radius: 999px;
    }
    .body-row {
      display: grid;
      grid-template-columns: 132px 1fr;
      gap: 10px;
      padding: 10px 12px;
      align-items: center;
    }
    .qr-box {
      width: 132px;
      height: 132px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }
    .qr-box svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .meta {
      font-size: 0.83rem;
      line-height: 1.38;
    }
    .meta .dest {
      font-weight: 800;
      font-size: 0.92rem;
      margin-bottom: 3px;
    }
    .meta .contents {
      margin-top: 5px;
      color: #374151;
      font-size: 0.8rem;
    }
    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }
    .pill {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .pill.fragile { background: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
    .pill.upright { background: #fef3c7; color: #92400e; border: 1px solid #fbbf24; }
    .pill.lift { background: #dbeafe; color: #1e40af; border: 1px solid #60a5fa; }
    .foot {
      border-top: 1px dashed #d1d5db;
      padding: 6px 12px;
      font-size: 0.74rem;
      color: #4b5563;
      display: flex;
      justify-content: space-between;
    }
    @media print {
      body { background: #ffffff; color: #000; padding: 0; }
      .toolbar, #scanResult { display: none !important; }
      .grid {
        max-width: none;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .label-card { border-width: 1.5px; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div>
      <h1>Offline QR Box Labels</h1>
      <div class="sub" id="summaryLine">Point any phone camera at a QR — reads contents &amp; unload stop offline (no server or wifi needed).</div>
    </div>
    <div class="controls">
      <select id="zoneFilter" onchange="renderGrid()">
        <option value="">All Penn Station Stops</option>
      </select>
      <label class="upload-btn">
        📷 Match Marked Box Photo
        <input id="boxPhotoInput" type="file" accept="image/*" capture="environment" style="display:none" onchange="identifyBoxPhoto(this)">
      </label>
      <button class="primary" onclick="window.print()">🖨 Print Sheet</button>
      <a id="backTo3D" class="btn-link" href="index.html">← 3D Truck View</a>
    </div>
  </div>

  <div id="scanResult"></div>
  <div id="grid" class="grid"></div>

  <script>
    const params = new URLSearchParams(location.search);
    const runId = params.get("run_id") || "sample_venue";
    const apiBase = (params.get("api") || "").replace(/\/+$/, "");
    let allLabels = [];

    document.getElementById("backTo3D").href = "index.html?run_id=" + encodeURIComponent(runId) + (params.get("mock") === "1" ? "&mock=1" : "");

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    async function loadLabels() {
      try {
        const res = await fetch(`${apiBase}/labels/${encodeURIComponent(runId)}`);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        allLabels = data.labels || [];
        document.getElementById("summaryLine").textContent =
          `${data.box_count} pre-filled QR box labels · Fleet: ${data.fleet_label || "ready"} · Scans 100% offline on any phone camera.`;
        populateFilter();
        renderGrid();
      } catch (err) {
        document.getElementById("summaryLine").textContent =
          "Offline preview mode — start backend API to generate live SVG QR codes (" + err.message + ").";
      }
    }

    function populateFilter() {
      const sel = document.getElementById("zoneFilter");
      const seen = new Map();
      for (const b of allLabels) {
        if (!seen.has(b.dest_zone)) {
          seen.set(b.dest_zone, `Stop ${b.dock_stop || "?"} · ${b.dest_zone_name}`);
        }
      }
      for (const [zid, name] of seen.entries()) {
        const opt = document.createElement("option");
        opt.value = zid;
        opt.textContent = name;
        sel.appendChild(opt);
      }
    }

    function renderGrid() {
      const filter = document.getElementById("zoneFilter").value;
      const items = filter ? allLabels.filter(b => b.dest_zone === filter) : allLabels;
      const grid = document.getElementById("grid");
      grid.innerHTML = items.map(b => `
        <article class="label-card">
          <div class="band" style="background:${esc(b.color_hex)}">
            <span class="short-name">${esc(b.short_name)}</span>
            <span class="stop-tag">Stop ${esc(b.dock_stop)} · ${esc(b.color_name)}</span>
          </div>
          <div class="body-row">
            <div class="qr-box">${b.qr_svg || ""}</div>
            <div class="meta">
              <div class="dest">${esc(b.dest_zone_name)}</div>
              <div>From: <strong>${esc(b.room_name)}</strong></div>
              <div><strong>Truck ${b.truck_index + 1}</strong> · Load #${b.load_seq} · <strong>Unload #${b.unload_seq}</strong> · ${b.weight_lb} lb</div>
              <div class="contents">${esc(b.contents)}</div>
              <div class="pills">
                ${b.fragile ? '<span class="pill fragile">Fragile</span>' : ""}
                ${b.must_stay_upright ? '<span class="pill upright">Keep Upright</span>' : ""}
                ${b.two_person ? '<span class="pill lift">2-Person Lift</span>' : ""}
              </div>
            </div>
          </div>
          <div class="foot">
            <span>Write in marker: <strong>${esc(b.short_name)}</strong></span>
            <span>QR holds ${b.qr_bytes_len}B offline manifest</span>
          </div>
        </article>
      `).join("");
    }

    async function identifyBoxPhoto(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const box = document.getElementById("scanResult");
      box.style.display = "block";
      box.textContent = "Reading box handwriting & matching with Gemini 4 Hydrogen + Decision 1…";
      const fd = new FormData();
      fd.append("file", file);
      try {
        const res = await fetch(`${apiBase}/labels/${encodeURIComponent(runId)}/identify`, {
          method: "POST",
          body: fd,
        });
        const out = await res.json();
        if (out.matched && out.box) {
          const b = out.box;
          const dmg = out.observation && out.observation.damaged
            ? ` · ⚠️ Damage noted: ${esc(out.observation.damage_note)}`
            : "";
          box.innerHTML =
            `<strong>Matched Box: ${esc(b.short_name)}</strong> (${Math.round((out.confidence || 0) * 100)}% confidence via <code>${esc(out.via)}</code>)${dmg}<br>` +
            `Contents: <strong>${esc(b.contents)}</strong> · Unload Stop ${esc(b.dock_stop)}: <strong>${esc(b.dest_zone_name)}</strong> (Truck ${b.truck_index + 1}, Unload #${b.unload_seq})`;
        } else {
          box.innerHTML = `No matching box found in this move (read: <code>${esc(out.observation && out.observation.written_text)}</code>).`;
        }
      } catch (err) {
        box.textContent = "Photo match failed: " + err.message;
      } finally {
        input.value = "";
      }
    }

    loadLabels();
  </script>
</body>
</html>
