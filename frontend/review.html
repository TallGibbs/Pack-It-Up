<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>Pack It Up · Check the list</title>
<link rel="stylesheet" href="ui/style.css">
</head>
<body>
<div id="mock-banner" class="mock-banner hidden">Mock mode: invented items, no server.</div>
<div class="totals" id="totals" aria-live="polite">
  <div class="inner">
    <div><span class="n" id="t-items">–</span><span class="u">items</span></div>
    <div><span class="n" id="t-vol">–</span><span class="u">cu ft</span></div>
    <div><span class="n" id="t-wt">–</span><span class="u">lb</span></div>
    <div><span class="n" id="t-boxes">–</span><span class="u">boxes</span></div>
  </div>
</div>
<main>
  <p class="steps">1 Film · <b>2 Check</b> · 3 Pack</p>
  <h1>Check the list</h1>
  <p class="muted" id="sub">Loading…</p>
  <p class="error hidden" id="err"></p>

  <section id="questions"></section>
  <section id="rooms"></section>
  <p class="small"><a id="add-more" class="btn link" href="capture.html">+ Film another room</a></p>
</main>

<div class="footer">
  <div class="inner">
    <div class="grow" id="handoff-note"><b>Next: the truck</b>Edits carry over</div>
    <a class="btn primary" id="handoff" href="#" aria-disabled="true">Plan the truck load →</a>
  </div>
</div>

<dialog id="add-dialog" class="sheet" aria-labelledby="add-title">
  <form id="add-form">
    <h2 id="add-title">Add an item <span class="muted" id="add-room-name"></span></h2>
    <input type="search" id="add-search" placeholder="Search: piano, sofa, desk…" autocomplete="off" enterkeyhint="search" aria-label="Search the item list">
    <div id="add-list" class="add-list"></div>
    <div id="add-custom" class="add-custom hidden">
      <label class="field" for="add-name">What is it?</label>
      <input type="text" id="add-name" maxlength="80" autocomplete="off">
      <div class="dims">
        <label>Length<input type="number" id="add-l" inputmode="decimal" min="1" max="240" step="any"></label>
        <label>Width<input type="number" id="add-w" inputmode="decimal" min="1" max="240" step="any"></label>
        <label>Height<input type="number" id="add-h" inputmode="decimal" min="1" max="240" step="any"></label>
      </div>
      <p class="small muted">In inches. A rough size is fine.</p>
    </div>
    <p class="error hidden" id="add-err"></p>
    <div class="add-actions">
      <div class="stepper" role="group" aria-label="How many">
        <button type="button" id="add-minus" aria-label="One fewer">−</button>
        <output id="add-qty">1</output>
        <button type="button" id="add-plus" aria-label="One more">+</button>
      </div>
      <button class="btn" type="button" id="add-cancel">Cancel</button>
      <button class="btn primary" id="add-go" disabled>Add</button>
    </div>
  </form>
</dialog>

<script src="mock/mock-api.js"></script>
<script src="ui/api.js"></script>
<script src="ui/questions.js"></script>
<script src="ui/review.js"></script>
</body>
</html>
